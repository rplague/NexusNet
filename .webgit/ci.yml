version: 1

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: native
    env:
      RUST_BACKTRACE: "1"
    steps:
      - name: 检查安装脚本语法 | Check installer shell syntax
        run: |
          for f in deb/config deb/postinst deb/prerm deb/postrm; do
            sh -n "$f"
          done
      - name: 运行 Rust 测试 | Run Rust tests
        run: cargo test --verbose
      - name: 运行安装器测试 | Run installer tests
        run: |
          python3 deb/tests/prefill_test.py
          python3 deb/tests/noninteractive_test.py
          python3 deb/tests/interactive_test.py
          python3 deb/tests/postinst_test.py

  fmt:
    runs-on: native
    needs: [test]
    steps:
      - name: 格式化检查 | Check formatting
        run: cargo fmt -- --check

  build-linux:
    runs-on: native
    needs: [test]
    steps:
      - name: 生产构建 | Build release
        run: cargo build --release
      - name: 构建 deb 包 | Build deb
        run: ./deploy/build-deb.sh

  build-windows:
    runs-on: native
    needs: [test]
    steps:
      - name: 交叉编译并打包 Windows | Cross build and package Windows
        run: |
          set -e
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            echo "缺少 mingw-w64，跳过 Windows 打包"
            exit 0
          fi
          if ! command -v makensis >/dev/null 2>&1; then
            echo "缺少 NSIS (makensis)，跳过 Windows 打包"
            exit 0
          fi
          rustup target add x86_64-pc-windows-gnu
          cargo build --release --target x86_64-pc-windows-gnu
          ./deploy/build-win.sh
