[package]
name = "NexusNet"
version = "0.3.1"
edition = "2024"
license = "GPL-3.0"

[package.metadata.deb]
maintainer = "OAHD"
copyright = "2026 OAHD"
extended-description = "NexusNet - OAHD 计划的核心网络层，基于 libp2p 的去中心化 P2P 节点网络。"
section = "net"
priority = "optional"
depends = "libc6 (>= 2.31)"
maintainer-scripts = "deb/"

[[package.metadata.deb.assets]]
source = "deploy/nexusnet.service"
target = "/lib/systemd/system/nexusnet.service"
mode = "644"

[[package.metadata.deb.assets]]
source = "deploy/nexusnet.tmpfiles.conf"
target = "/usr/lib/tmpfiles.d/nexusnet.conf"
mode = "644"

[[package.metadata.deb.assets]]
source = "deploy/nexusnet.sysusers"
target = "/usr/lib/sysusers.d/nexusnet.conf"
mode = "644"

[dependencies]
chrono = "0.4.44"
colored = "3.1.1"
flate2 = "1.1.9"
libp2p = { version = "0.56.0", features = ["full"] }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
get_if_addrs = "0.5.3"
base64 = "0.22"
scopeguard = "1"
uuid = "1.23.1"
ml-kem = { version = "0.3.2", features = ["alloc", "getrandom", "zeroize"] }
ml-dsa = { version = "0.1.1", features = ["alloc", "getrandom", "rand_core", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
