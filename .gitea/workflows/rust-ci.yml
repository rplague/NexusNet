name: Rust CI
on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: qst001

    steps:
      - name: Checkout code manually
        run: |
          git clone --depth 1 --progress https://${{ secrets.GITHUB_TOKEN }}@git.oahd.cn/${{ github.repository }}.git .
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout ${{ github.sha }}

      - name: 代码格式化检查 | Check code format
        run: /home/git/.cargo/bin/cargo fmt -- --check

      - name: 运行测试 | Run tests
        run: /home/git/.cargo/bin/cargo test --verbose

      - name: 生产构建 | Build in release mode
        run: /home/git/.cargo/bin/cargo build --release

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: qst001
    needs: [build-and-test]

    steps:
      - name: Checkout with full history
        run: |
          git clone --progress https://${{ secrets.GITHUB_TOKEN }}@git.oahd.cn/${{ github.repository }}.git .
          git fetch --tags origin

      - name: 提取 Cargo.toml 版本并与最新 tag 对比
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "cargo_version=$VERSION" >> $GITHUB_ENV
          LATEST_TAG=$(git tag --sort=-version:refname | head -1 || echo "")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_ENV
          echo "Cargo.toml: $VERSION, latest tag: $LATEST_TAG"

      - name: 构建 Release 二进制
        if: env.cargo_version != '' && format('v{0}', env.cargo_version) != env.latest_tag
        run: /home/git/.cargo/bin/cargo build --release

      - name: 构建 deb 包
        if: env.cargo_version != '' && format('v{0}', env.cargo_version) != env.latest_tag
        run: |
          command -v dpkg-deb >/dev/null 2>&1 || {
            echo "ERROR: 需要 dpkg-deb 才能构建 .deb（Debian/Ubuntu 镜像）"
            exit 1
          }
          ./deploy/build-deb.sh

      - name: 创建 Release 并上传附件
        if: env.cargo_version != '' && format('v{0}', env.cargo_version) != env.latest_tag
        run: |
          set -x
          TAG="v${{ env.cargo_version }}"
          REPO="${{ github.repository }}"
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          API="https://git.oahd.cn/api/v1/repos/$REPO"
          BINARY="target/release/NexusNet"
          DEB="target/packaging"/nexusnet_*.deb

          echo "TAG=$TAG  REPO=$REPO  API=$API"
          ls -lh "$BINARY" $DEB

          # Gitea API 创建 Release（tag 不存在时自动创建）
          CREATE_RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\"}" \
            "$API/releases")
          HTTP_CODE=$(echo "$CREATE_RESP" | tail -1)
          BODY=$(echo "$CREATE_RESP" | sed '$d')
          RELEASE_ID=$(echo "$BODY" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2) || true
          echo "RELEASE_ID=$RELEASE_ID"

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Failed to create release"
            exit 1
          fi

          upload_asset() {
            local asset="$1" name="$2"
            local resp code
            resp=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              "$API/releases/$RELEASE_ID/assets?name=$name" \
              --data-binary @"$asset")
            code=$(echo "$resp" | tail -1)
            if [ "$code" != "201" ]; then
              echo "ERROR: Upload $name failed with HTTP $code"
              exit 1
            fi
          }

          # 上传二进制与 deb 包
          upload_asset "$BINARY" "NexusNet-linux-amd64"
          for d in $DEB; do
            upload_asset "$d" "$(basename "$d")"
          done

          echo "Release $TAG created and assets uploaded successfully"
