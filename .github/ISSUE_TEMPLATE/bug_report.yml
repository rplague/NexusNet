name: Bug report
description: Report a reproducible problem in NexusNet
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove key material, private addresses and
        secrets from configs and logs before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NexusNet version
      description: The release tag, or the output of `git describe --tags`.
      placeholder: "0.6.2-11020"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (Debian/Ubuntu package)
        - Linux (other)
        - Windows
        - Android / HarmonyOS
        - Other
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Redact keys, keypair paths and private addresses.
      render: toml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from journalctl or the file log.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and private keys from this report.
          required: true
